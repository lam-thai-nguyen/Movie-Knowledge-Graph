<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Movie knowledge graph workflow</title>
  <desc id="desc">Six-stage workflow from ontology design to a SPARQL query interface.</desc>

  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #17324d; text-anchor: middle; }
      .detail { font-family: Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #496274; text-anchor: middle; }
      .number { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .card { fill: #f7f9fb; stroke: #c9d5df; stroke-width: 2; }
      .icon { fill: none; stroke: #1d7180; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .connector { fill: none; stroke: #9fb3c1; stroke-width: 3; stroke-linecap: round; }
      .step { fill: #1d7180; }
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#9fb3c1"/>
    </marker>
  </defs>

  <rect width="1600" height="360" fill="#ffffff"/>


  <path class="connector" d="M251 170 H279" marker-end="url(#arrow)"/>
  <path class="connector" d="M518 170 H546" marker-end="url(#arrow)"/>
  <path class="connector" d="M785 170 H813" marker-end="url(#arrow)"/>
  <path class="connector" d="M1052 170 H1080" marker-end="url(#arrow)"/>
  <path class="connector" d="M1319 170 H1347" marker-end="url(#arrow)"/>

  <g transform="translate(20 60)">
    <rect class="card" width="225" height="220" rx="18"/>
    <circle class="step" cx="28" cy="28" r="14"/>
    <text class="number" x="28" y="32">1</text>
    <g class="icon" transform="translate(76.5 40)">
      <circle cx="36" cy="18" r="10"/>
      <circle cx="14" cy="66" r="10"/>
      <circle cx="58" cy="66" r="10"/>
      <path d="M29 27 L19 57 M43 27 L53 57 M24 66 H48"/>
    </g>
    <text class="label" x="112.5" y="152">Ontology</text>
    <text class="detail" x="112.5" y="184">
      <tspan x="112.5">Reuse Schema.org</tspan>
      <tspan x="112.5" dy="16">classes and properties</tspan>
    </text>
  </g>

  <g transform="translate(287 60)">
    <rect class="card" width="225" height="220" rx="18"/>
    <circle class="step" cx="28" cy="28" r="14"/>
    <text class="number" x="28" y="32">2</text>
    <g class="icon" transform="translate(70.5 34)">
      <path d="M18 22 H58 V70 H18 Z"/>
      <path d="M26 12 H66 V60"/>
      <path d="M27 36 H49 M27 49 H49"/>
      <path d="M38 84 V70 M30 84 H46"/>
    </g>
    <text class="label" x="112.5" y="152">TMDB data</text>
    <text class="detail" x="112.5" y="184">
      <tspan x="112.5">Collect movie metadata</tspan>
      <tspan x="112.5" dy="16">as CSV from TMDB</tspan>
    </text>
  </g>

  <g transform="translate(554 60)">
    <rect class="card" width="225" height="220" rx="18"/>
    <circle class="step" cx="28" cy="28" r="14"/>
    <text class="number" x="28" y="32">3</text>
    <g class="icon" transform="translate(70.5 37.5)">
      <path d="M12 25 L48 12 L72 25 L36 38 Z"/>
      <path d="M12 25 V64 L36 77 L72 64 V25"/>
      <path d="M36 38 V77"/>
      <path d="M24 46 L48 36 M24 59 L48 49"/>
    </g>
    <text class="label" x="112.5" y="152">RDF / Turtle</text>
    <text class="detail" x="112.5" y="184">
      <tspan x="112.5">Convert CSV records</tspan>
      <tspan x="112.5" dy="16">to RDF with stable URIs</tspan>
    </text>
  </g>

  <g transform="translate(821 60)">
    <rect class="card" width="225" height="220" rx="18"/>
    <circle class="step" cx="28" cy="28" r="14"/>
    <text class="number" x="28" y="32">4</text>
    <g class="icon" transform="translate(72.5 35)">
      <path d="M40 12 L70 30 V64 L40 82 L10 64 V30 Z"/>
      <path d="M40 12 V47 M10 30 L40 47 L70 30 M40 47 V82"/>
      <circle cx="40" cy="47" r="7"/>
    </g>
    <text class="label" x="112.5" y="152">OWL model</text>
    <text class="detail" x="112.5" y="184">
      <tspan x="112.5">Define classes, properties</tspan>
      <tspan x="112.5" dy="16">and restrictions in OWL</tspan>
    </text>
  </g>

  <g transform="translate(1088 60)">
    <rect class="card" width="225" height="220" rx="18"/>
    <circle class="step" cx="28" cy="28" r="14"/>
    <text class="number" x="28" y="32">5</text>
    <g class="icon" transform="translate(68.5 40)">
      <circle cx="22" cy="42" r="16"/>
      <circle cx="66" cy="42" r="16"/>
      <path d="M34 34 L54 26 M34 50 L54 58"/>
      <path d="M56 42 H44"/>
    </g>
    <text class="label" x="112.5" y="152">Link datasets</text>
    <text class="detail" x="112.5" y="184">
      <tspan x="112.5">Connect entities to</tspan>
      <tspan x="112.5" dy="16">DBpedia and Wikidata</tspan>
    </text>
  </g>

  <g transform="translate(1355 60)">
    <rect class="card" width="225" height="220" rx="18"/>
    <circle class="step" cx="28" cy="28" r="14"/>
    <text class="number" x="28" y="32">6</text>
    <g class="icon" transform="translate(71.5 39)">
      <path d="M12 18 H70 V68 H12 Z"/>
      <path d="M12 30 H70"/>
      <circle cx="22" cy="24" r="2" fill="#1d7180" stroke="none"/>
      <circle cx="30" cy="24" r="2" fill="#1d7180" stroke="none"/>
      <path d="M24 49 L34 58 L53 40"/>
    </g>
    <text class="label" x="112.5" y="152">SPARQL</text>
    <text class="detail" x="112.5" y="184">
      <tspan x="112.5">Query the graph through</tspan>
      <tspan x="112.5" dy="16">Apache Jena Fuseki</tspan>
    </text>
  </g>
</svg>
